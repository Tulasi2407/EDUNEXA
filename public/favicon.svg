<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1020" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7657F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Left Wing (Edu - Open Book / Knowledge) -->
    <linearGradient id="leftWing" x1="25" y1="35" x2="60" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Right Wing (Nexa - Neural Loop / Growth) -->
    <linearGradient id="rightWing" x1="60" y1="35" x2="95" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Center Bridge (Infinity Nexus) -->
    <linearGradient id="nexusBridge" x1="30" y1="40" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Core AI Glow & Spark -->
    <radialGradient id="coreGlow" cx="60" cy="58" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC857" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#7657F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7657F6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sparkGrad" x1="55" y1="50" x2="65" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.2" />

  <!-- Ambient Glow Behind Core -->
  <circle cx="60" cy="58" r="30" fill="url(#coreGlow)" />

  <!-- Left Knowledge Wing (Book Leaf) -->
  <path d="M 58 38 C 45 36 32 42 27 54 C 23 64 26 77 34 83 C 41 89 51 86 58 80 Z" 
        fill="url(#leftWing)" 
        opacity="0.92" />

  <!-- Right Neural Wing (Ascending Nexus) -->
  <path d="M 62 38 C 75 36 88 42 93 54 C 97 64 94 77 86 83 C 79 89 69 86 62 80 Z" 
        fill="url(#rightWing)" 
        opacity="0.92" />

  <!-- Central Möbius Intersecting Loop -->
  <path d="M 38 68 C 44 76 54 78 60 70 C 66 62 74 48 84 54 C 90 58 88 68 82 74 C 74 82 64 78 60 70 C 56 62 46 48 36 54 C 30 58 32 64 38 68 Z" 
        fill="url(#nexusBridge)" 
        opacity="0.85" />

  <!-- Synaptic Connector Nodes (Student, Teacher, Parent Trinity) -->
  <circle cx="34" cy="48" r="3.2" fill="#A78BFA" opacity="0.9" />
  <circle cx="86" cy="48" r="3.2" fill="#38BDF8" opacity="0.9" />
  <circle cx="60" cy="85" r="3" fill="#10B981" opacity="0.9" />

  <!-- Connecting Thin Neural Filaments -->
  <path d="M 34 48 Q 46 54 60 58" stroke="#A78BFA" stroke-width="1.2" stroke-linecap="round" opacity="0.5" stroke-dasharray="2 3" />
  <path d="M 86 48 Q 74 54 60 58" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.5" stroke-dasharray="2 3" />
  <path d="M 60 85 L 60 66" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" opacity="0.5" stroke-dasharray="2 3" />

  <!-- AI Intelligence Core Spark (8-Point Radiant Diamond Star) -->
  <g filter="url(#glowFilter)">
    <!-- 4 Major Points -->
    <path d="M 60 46 Q 60 58 48 58 Q 60 58 60 70 Q 60 58 72 58 Q 60 58 60 46 Z" fill="url(#sparkGrad)" />
    <!-- 4 Minor Diagonal Rays -->
    <path d="M 60 52 Q 60 58 54 58 Q 60 58 60 64 Q 60 58 66 58 Q 60 58 60 52 Z" fill="#FFFBEB" opacity="0.9" />
    <!-- Center Radiant Core -->
    <circle cx="60" cy="58" r="2.2" fill="#FFFFFF" />
  </g>
</svg>
